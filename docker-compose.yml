services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fieldwise
      POSTGRES_PASSWORD: fieldwise
      POSTGRES_DB: fieldwise
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwise -d fieldwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
