x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://fieldwise:fieldwise@db:5432/fieldwise
    REDIS_URL: redis://redis:6379/0
    STORAGE_URL: file:///data/storage
  volumes:
    - ./backend/data/storage:/data/storage   # shared with the CLI running on the host
    - models:/models
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fieldwise
      POSTGRES_PASSWORD: fieldwise
      POSTGRES_DB: fieldwise
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwise -d fieldwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    profiles: [app]
    command: sh -c "fieldwise db upgrade && fieldwise schemas sync"
    restart: "no"

  api:
    <<: *backend
    profiles: [app]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    profiles: [app]
    command: celery -A fieldwise.worker.app:celery_app worker --loglevel=info --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./web
    profiles: [app]
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  models:
