[project]
name = "fieldwise"
version = "0.1.0"
description = "Schema-driven document extraction with a review UI and per-field evals."
license = "MIT"
authors = [{ name = "Ilia Muravev", email = "ilia.muravev.dev@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53,<1",
  "sqlalchemy>=2.0.54,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.20,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "typer>=0.27,<1",
  "rich>=15,<16",
  "structlog>=26,<27",
  "pgvector>=0.5,<1",
  "pypdfium2>=5.13,<6",
  "pillow>=12,<13",
  "pyarrow>=25,<26",
  "huggingface-hub>=0.35,<2",
  "boto3>=1.43,<2",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.22,<2",
  "opencv-python-headless>=4.10,<5",
  "anthropic>=1.6,<2",
  "rapidfuzz>=3.14,<4",
  "jsonschema>=4.26,<5",
  "openai>=2,<3",
  "fastembed>=0.8,<1",
]

[project.scripts]
fieldwise = "fieldwise.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "httpx2>=2.13,<3",
  "testcontainers[postgres]>=4.15,<5",
  "moto[s3]>=5,<6",
  "boto3-stubs[s3]>=1.43,<2",
  "pyarrow-stubs>=20",
  "types-jsonschema>=4.25",
]

[tool.uv]
# rapidocr declares opencv-python; the headless build avoids GUI libraries in Docker.
override-dependencies = ["opencv-python; python_version < '0'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldwise"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "ANN", "PL", "S"]
ignore = [
  "PLR0913", # many arguments are fine for explicit pipelines
  "PLR2004", # magic numbers in tests and pricing tables
  "S101",    # assert is the test idiom
  "S311",    # random is not used for security here
  "ANN401",  # Any is needed for JSON payloads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "S105", "S106", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["fieldwise"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: needs Docker (testcontainers)"]
filterwarnings = [
  "error",
  # third-party alias, tracked upstream in starlette
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["fieldwise"]
branch = true
